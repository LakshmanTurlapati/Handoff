# achilles-terminal CI workflow.
#
# Wired by Phase 15 Plan 04 of milestone v1.3 Terminal-only Achilles.
# Two jobs:
#   1. test            - dual-runtime (Bun 1.3.14, Node 22) x cross-OS
#                        (ubuntu-latest, macos-latest, windows-latest)
#                        matrix running typecheck + lint + vitest against
#                        apps/achilles-terminal. Catches runtime drift
#                        between Bun and Node at the boundary it was
#                        introduced.
#   2. compile-binaries - 5 native-OS runners (macos-latest, macos-13,
#                        ubuntu-latest, ubuntu-22.04-arm, windows-latest)
#                        each invoking `bun build --compile` and then
#                        running the produced binary's `--version` as a
#                        gating smoke test. The smoke step is the third
#                        layer of the v1.2 silent-launch defence: a
#                        binary that exits 0 with empty stdout fails the
#                        grep -E semver check and breaks the build.
#
# IMPORTANT INSTALL NOTE (Phase 15 deviation D-15-02):
#   npm 10.9.3 strictly enforces os/cpu constraints on workspace
#   packages, not only on registry-fetched optionalDependencies. Plain
#   `npm ci` at the repo root fails with EBADPLATFORM for the
#   `@achilles/cli-<platform>-<arch>` siblings on any host whose
#   platform-arch does not match one of the 5 siblings. The CI install
#   step therefore uses `npm ci --include=optional --force` so the
#   siblings are skipped silently rather than aborting the install.
#   Phase 19 will rewire siblings to real registry-fetched
#   optionalDependencies; at that point this workaround can drop the
#   --force flag.
#
# REQUIRED GITHUB ACTIONS SECRETS / VARIABLES: none. This workflow runs
# install + test + compile only; it does not publish, deploy, or call
# any external service. The GITHUB_TOKEN provided to every workflow run
# is sufficient and is scoped down to contents: read by the permissions
# block below.

name: achilles-terminal CI

on:
  pull_request:
    paths:
      - "apps/achilles-terminal/**"
      - "apps/cli-*/**"
      - ".github/workflows/achilles-terminal-ci.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "apps/achilles-terminal/**"
      - "apps/cli-*/**"
      - ".github/workflows/achilles-terminal-ci.yml"
      - "package.json"
      - "package-lock.json"

concurrency:
  # A later push to the same ref cancels an in-flight run so the most
  # recent commit on the branch is always the one being validated.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum privilege: install + test + compile only. No repo writes, no
# image pushes, no comments. Scoping to contents: read prevents a
# compromised step from abusing GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [bun, node]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Bun 1.3.14
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies
        # See D-15-02: --include=optional --force is mandatory; plain
        # `npm ci` fails with EBADPLATFORM on every matrix entry because
        # npm 10.9.3 enforces os/cpu on workspace packages.
        run: npm ci --include=optional --force

      - name: Typecheck apps/achilles-terminal
        run: npm run typecheck --workspace apps/achilles-terminal

      - name: Lint apps/achilles-terminal
        run: npm run lint --workspace apps/achilles-terminal -- --max-warnings 0

      - name: Vitest under Node
        # --pool=forks is mandatory under both Bun and Node per
        # Phase 15 Pitfall 9 (Bun + vitest thread pool emits
        # worker_threads warnings that obscure real failures, and the
        # Node side runs identically for parity).
        if: matrix.runtime == 'node'
        run: npm test --workspace apps/achilles-terminal -- --pool=forks

      - name: Vitest under Bun
        if: matrix.runtime == 'bun'
        working-directory: apps/achilles-terminal
        run: bunx vitest run --pool=forks

      - name: Vitest MOCK_LOOP=1 integration (Node)
        # Phase 17 Plan 05 — upstream CI smoke gate against the
        # v1.2 silent-launch shape. Runs the in-process end-to-end
        # integration test that drives Plan 04's Session composition
        # root with all four DI factories swapped for mocks. A
        # failure here blocks the merge before the binary path
        # could regress.
        if: matrix.runtime == 'node'
        working-directory: apps/achilles-terminal
        env:
          MOCK_LOOP: "1"
        run: npx vitest run --pool=forks tests/integration/

      - name: Vitest MOCK_LOOP=1 integration (Bun)
        # Bun-runtime parity for the MOCK_LOOP=1 step. Same test
        # contract — the test must pass identically under both
        # runtimes so a Bun-only divergence is caught at the matrix
        # layer.
        if: matrix.runtime == 'bun'
        working-directory: apps/achilles-terminal
        env:
          MOCK_LOOP: "1"
        run: bunx vitest run --pool=forks tests/integration/

  loop-02-invariant:
    # Phase 17 Plan 05 — structural defence of the LOOP-02 invariant.
    # The job runs once per pull_request / push event (no matrix)
    # because the invariant is OS- and runtime-agnostic — a single
    # ubuntu-latest runner is sufficient.
    #
    # Two checks:
    #
    #   1. git diff against the five protected paths
    #      (packages/voice-protocol, packages/voice-stt,
    #      packages/voice-tts, packages/claude-code-bridge,
    #      packages/achilles-skill/skill/prompts/companion.md). Any
    #      output fails the build with a clear stderr line listing
    #      the offending files.
    #
    #   2. companion.md SHA-256 source-of-truth check — invokes
    #      apps/achilles-terminal/scripts/check-source-of-truth.mjs
    #      which compares the source-of-truth file's SHA-256 against
    #      the SOURCE_OF_TRUTH_HASH const embedded inside
    #      apps/achilles-terminal/src/audio/companion-md.ts.
    #
    # The job runs in parallel with `jobs.test` so the merge gate
    # fires fast.
    name: LOOP-02 invariant
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository with full history
        # fetch-depth: 0 is required so the git diff below can
        # resolve the merge-base SHA from pull_request events.
        # Shallow clones (the default depth: 1) would refuse the
        # base..head ref.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        # Required for the check-source-of-truth.mjs step below.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace dependencies
        # The source-of-truth script imports companionPromptPath
        # from @achilles/achilles-skill, which lives in the workspace
        # graph. The standard D-15-02 install command applies.
        run: npm ci --include=optional --force

      - name: Assert no diff under LOOP-02 protected paths
        shell: bash
        run: |
          set -euo pipefail
          # The LOOP-02 invariant: Phase 17 may IMPORT packages/voice-*
          # and packages/claude-code-bridge at runtime but MUST NOT
          # modify any file under them. The companion.md SHA-256
          # source-of-truth check below is the runtime enforcement;
          # this CI step is the source-tree enforcement against the
          # merge base.
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "[ci] LOOP-02 check: base=$BASE_SHA head=$HEAD_SHA"
          DIFF=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            packages/voice-protocol \
            packages/voice-stt \
            packages/voice-tts \
            packages/claude-code-bridge \
            packages/achilles-skill/skill/prompts/companion.md || true)
          if [ -n "$DIFF" ]; then
            echo "[ci] FAIL: LOOP-02 invariant violated. Modified files:" >&2
            echo "$DIFF" >&2
            exit 1
          fi
          echo "[ci] OK: LOOP-02 invariant holds across base..head"

      - name: Run companion.md SHA-256 source-of-truth check
        # Plan 17-01 created scripts/check-source-of-truth.mjs; this
        # CI step invokes it to assert the embedded hash in
        # companion-md.ts matches the source-of-truth file on disk.
        # A drift would mean either (a) the source file was edited
        # without updating the const, or (b) the const was edited but
        # the source file was not — both block LOOP-02.
        shell: bash
        working-directory: apps/achilles-terminal
        run: |
          set -euo pipefail
          node scripts/check-source-of-truth.mjs

  compile-binaries:
    name: compile (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: darwin-arm64
            runner: macos-latest
            bunTarget: bun-darwin-arm64
            out: cli-darwin-arm64/bin/achilles
          - name: darwin-x64
            runner: macos-13
            bunTarget: bun-darwin-x64
            out: cli-darwin-x64/bin/achilles
          - name: linux-x64
            runner: ubuntu-latest
            bunTarget: bun-linux-x64
            out: cli-linux-x64/bin/achilles
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            bunTarget: bun-linux-arm64
            out: cli-linux-arm64/bin/achilles
          - name: win32-x64
            runner: windows-latest
            bunTarget: bun-windows-x64
            out: cli-win32-x64/bin/achilles.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install workspace dependencies
        # See D-15-02: --include=optional --force is mandatory.
        run: npm ci --include=optional --force

      - name: Compile binary
        working-directory: apps/achilles-terminal
        run: |
          mkdir -p ../$(dirname '${{ matrix.target.out }}')
          bun build src/cli.ts --compile --target=${{ matrix.target.bunTarget }} --outfile=../${{ matrix.target.out }} --minify

      - name: Smoke test - achilles --version
        # GATING smoke per Phase 15 CONTEXT.md item 7 (silent-launch
        # defence). The step (a) confirms the file exists, (b) executes
        # it with --version, (c) asserts non-zero exit fails the step
        # via `set -e` semantics, (d) asserts stdout matches semver via
        # grep -E. A v1.2-shape silent launch (binary exits 0 with empty
        # stdout) fails the grep check.
        #
        # shell: bash works on all GitHub-hosted Windows runners via Git
        # Bash; using a single shell across the matrix keeps the script
        # portable.
        working-directory: apps/achilles-terminal
        shell: bash
        run: |
          set -euo pipefail
          BIN_PATH="../${{ matrix.target.out }}"
          if [ ! -f "$BIN_PATH" ]; then
            echo "[ci] FAIL: compiled binary missing at $BIN_PATH" >&2
            exit 1
          fi
          OUTPUT=$("$BIN_PATH" --version)
          echo "[ci] version output: ${OUTPUT}"
          echo "${OUTPUT}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+'
