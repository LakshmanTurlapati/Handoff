<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=260, height=260" />
    <title>Achilles (headless)</title>
    <style>
      html,
      body {
        background: transparent;
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 260px;
        height: 260px;
        pointer-events: none;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        color: #e8eaed;
      }
      #root {
        width: 260px;
        height: 260px;
      }
    </style>
  </head>
  <body>
    <!--
      Plan 11-02 update: removed `data-testid="floating-shell"` from the
      root wrapper because the FloatingShell React component now owns
      that testid (UI-SPEC §10 locks the selector). Leaving the testid
      on both elements yielded duplicate locator hits in strict-mode
      Playwright (the scaffold spec failed against the headless bundle).
    -->
    <div id="root"></div>
    <!--
      Mock bridge MUST load before the renderer entry so window.__mockBridge
      is populated before main.tsx hooks into it.
    -->
    <script type="module" src="./mock-bridge.ts"></script>
    <script type="module" src="../../src/renderer/main.tsx"></script>
  </body>
</html>
